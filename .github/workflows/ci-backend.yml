
name: Backend CI

on:
  push:
    branches: ["main", "master"]

  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    name: Validar Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: "file:./ci.db"

    steps:
      # Baixa os arquivos do repositório
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Configura o Node.js e o cache do npm
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      # Instala as dependências do backend
      - name: Instalar dependências
        run: npm ci

      # Verifica a estrutura do schema Prisma
      - name: Validar schema Prisma
        run: npx prisma validate

      # Gera o Prisma Client
      - name: Gerar Prisma Client
        run: npx prisma generate

      # Cria um banco temporário e aplica as migrations
      - name: Aplicar migrations
        run: npx prisma migrate deploy

      # Verifica se todas as migrations foram aplicadas
      - name: Verificar migrations
        run: npx prisma migrate status
