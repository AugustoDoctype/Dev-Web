name: Backend CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    name: Validar Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: "file:./ci.db"
      # Exclusivamente para testes. Nunca usar em produção.
      JWT_SECRET: "ci-only-test-secret-do-not-use-in-production-2026-eciclo"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Instalar dependências
        run: npm ci

      - name: Validar schema Prisma
        run: npx prisma validate

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Verificar migrations
        run: npx prisma migrate status

      - name: Executar testes automatizados
        run: npm test
