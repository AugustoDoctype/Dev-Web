name: Frontend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Isso avisa o GitHub para rodar tudo dentro da pasta frontend
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22' 

    - name: Instalar dependências
      run: npm install

    - name: Testar o Build do Vite
      run: npm run build